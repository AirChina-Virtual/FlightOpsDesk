name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore VamSys.slnx --locked-mode
      - name: Analyzer baseline
        run: pwsh -File scripts/check-analyzer-baseline.ps1
      - name: QA tool and benchmarks build
        run: |
          dotnet build tools/VamSys.QaSeed/VamSys.QaSeed.csproj -c Release -p:RestoreLockedMode=true
          dotnet build tests/VamSys.Benchmarks/VamSys.Benchmarks.csproj -c Release -p:RestoreLockedMode=true
      - name: Unit tests
        run: dotnet test --project tests/VamSys.UnitTests/VamSys.UnitTests.csproj -c Release -p:RestoreLockedMode=true
      - name: Integration tests
        run: dotnet test --project tests/VamSys.IntegrationTests/VamSys.IntegrationTests.csproj -c Release -p:RestoreLockedMode=true
