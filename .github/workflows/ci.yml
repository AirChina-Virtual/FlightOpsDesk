name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore VamSys.slnx --locked-mode
      - name: Legacy suite
        run: dotnet run --project tests/VamSys.Tests/VamSys.Tests.csproj -c Release -p:RestoreLockedMode=true
      - name: Unit tests
        run: dotnet test --project tests/VamSys.UnitTests/VamSys.UnitTests.csproj -c Release -p:RestoreLockedMode=true
      - name: Integration tests
        run: dotnet test --project tests/VamSys.IntegrationTests/VamSys.IntegrationTests.csproj -c Release -p:RestoreLockedMode=true
